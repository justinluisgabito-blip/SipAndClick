
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Sip & Click</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">

    <div class="auth-image">
        <div class="image-content">
            <h1>Sip & Click</h1>
            <p>Join us and discover your new favorite coffee.</p>
        </div>
    </div>

    <div class="auth-form">
        <a href="index.html" class="back-home">← Back to Home</a>

        <div class="logo">☕ Sip <span>&</span> Click</div>

        <h2>Create Account</h2>
        <p class="subtitle">Register now and enjoy your coffee moments.</p>

        <form id="registerForm">

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password"
                       placeholder="Create a password"
                       minlength="4" required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Confirm your password"
                       minlength="4" required>
            </div>

            <button type="submit" class="auth-button">Create Account</button>

            <p id="message"></p>
        </form>

        <p class="switch-text">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

        <p class="footer-text">
            © 2026 Sip & Click. All rights reserved.
        </p>
    </div>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const message = document.getElementById("message");

    let users = JSON.parse(localStorage.getItem("sipUsers") || "[]");

    if (password !== confirmPassword) {
        message.style.color = "red";
        message.textContent = "Passwords do not match!";
        return;
    }

    if (users.some(user => user.email === email)) {
        message.style.color = "red";
        message.textContent = "Email is already registered!";
        return;
    }

    users.push({
        name: name,
        email: email,
        password: password
    });

    localStorage.setItem("sipUsers", JSON.stringify(users));

    message.style.color = "green";
    message.textContent = "Registration successful! Redirecting to login...";

    document.getElementById("registerForm").reset();

    setTimeout(() => {
        window.location.href = "login.html";
    }, 1500);
});
</script>

</body>
</html>
