
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sip & Click</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">

    <div class="auth-image">
        <div class="image-content">
            <h1>Sip & Click</h1>
            <p>Your favorite coffee, just a click away.</p>
        </div>
    </div>

    <div class="auth-form">
        <a href="index.html" class="back-home">← Back to Home</a>

        <div class="logo">☕ Sip <span>&</span> Click</div>

        <h2>Welcome Back!</h2>
        <p class="subtitle">Login to your account to continue.</p>

        <form id="loginForm">

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail"
                       placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword"
                       placeholder="Enter your password" required>
            </div>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>
            </div>

            <button type="submit" class="auth-button">Login</button>

            <p id="message"></p>
        </form>

        <p class="switch-text">
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

        <p class="footer-text">
            © 2026 Sip & Click. All rights reserved.
        </p>
    </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const email = document.getElementById("loginEmail").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;
    const message = document.getElementById("message");

    const users = JSON.parse(localStorage.getItem("sipUsers") || "[]");

    const user = users.find(u =>
        u.email === email && u.password === password
    );

    if (user) {
        localStorage.setItem("sipCurrentUser", JSON.stringify({
            name: user.name,
            email: user.email
        }));

        message.style.color = "green";
        message.textContent = "Login successful! Redirecting...";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1000);

    } else {
        message.style.color = "red";
        message.textContent = "Incorrect email or password.";
    }
});
</script>

</body>
</html>
